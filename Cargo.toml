[package]
name = "loopkeel"
version = "0.1.0"
edition = "2021"
description = "A resilient CLI orchestrator for agentic work loops"
license = "MIT"
readme = "README.md"
repository = "https://github.com/hebertcisco/loopkeel"
homepage = "https://github.com/hebertcisco/loopkeel"
documentation = "https://docs.rs/loopkeel"
keywords = ["cli", "agents", "automation", "orchestration"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "loop"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "signal", "time", "fs", "io-util", "process", "sync"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
tempfile = "3.13"
